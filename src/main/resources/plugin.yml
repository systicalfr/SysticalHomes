name: HomesGUI
version: '1.0.0'
main: com.homesgui.HomesGUI
api-version: '1.21'
author: YourName
description: A GUI-based homes plugin - up to 5 homes per player.

commands:
  home:
    description: Open your homes menu, or teleport to a named home
    usage: /home [name]
  homes:
    description: Open your homes menu
    usage: /homes
  sethome:
    description: Set a home at your current location
    usage: /sethome [name]
  delhome:
    description: Delete a home by name
    usage: /delhome <name>
